name: Android APK build
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK (temporary, not update-safe)
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HalloweenNavigator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Restore permanent signing key (if configured)
        id: signing
        env:
          KEY_B64: ${{ secrets.HALLOWEEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALLOWEEN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALLOWEEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALLOWEEN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/halloween-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Permanent signing secrets missing. Release APK not built."
          fi
      - name: Build updateable signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          HALLOWEEN_KEYSTORE_PATH: ${{ runner.temp }}/halloween-release.jks
          HALLOWEEN_STORE_PASSWORD: ${{ secrets.HALLOWEEN_STORE_PASSWORD }}
          HALLOWEEN_KEY_ALIAS: ${{ secrets.HALLOWEEN_KEY_ALIAS }}
          HALLOWEEN_KEY_PASSWORD: ${{ secrets.HALLOWEEN_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: HalloweenNavigator-signed-updateable-apk
          path: app/build/outputs/apk/release/app-release.apk
