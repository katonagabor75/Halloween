plugins { id 'com.android.application' }
android {
    namespace 'hu.kistarcsa.halloweennavigator'
    compileSdk 35
    defaultConfig {
        applicationId 'hu.kistarcsa.halloweennavigator'
        minSdk 29
        targetSdk 35
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '2')
        versionName '0.7.2'
    }
    signingConfigs {
        release {
            if (System.getenv('HALLOWEEN_KEYSTORE_PATH')) {
                storeFile file(System.getenv('HALLOWEEN_KEYSTORE_PATH'))
                storePassword System.getenv('HALLOWEEN_STORE_PASSWORD')
                keyAlias System.getenv('HALLOWEEN_KEY_ALIAS')
                keyPassword System.getenv('HALLOWEEN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
